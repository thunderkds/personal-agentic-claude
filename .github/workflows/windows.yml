# Windows CI (T263): runs the kit's Python tests on a real Windows runner.
#
# The job may be red at first. It lists what T264..T267 must fix. POSIX-only tests are
# skipped on win32 through the `posix_only` marker in the root `conftest.py`, each with a reason.
# Shell suites (tests/*.sh) do not run here.
#
# To make this job required (a repository admin does this; nothing in this file can):
#   GitHub -> Settings -> Branches -> Branch protection rule for `main` (or Settings -> Rules ->
#   Rulesets) -> tick "Require status checks to pass before merging" -> search for
#   "Python tests (Windows)" -> select it -> Save. Do this only when the job is green; the plan
#   (docs/windows-support-plan.md) requires it before T264 moves to Done.
name: Windows

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Action references are pinned to a full commit SHA (the tag is in the comment).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pytest and PyYAML
        run: python -I -m pip install pytest pyyaml

      - name: Python tests
        run: python -I -m pytest tests/ .claude/hooks/tests/ -q
