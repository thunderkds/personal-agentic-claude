name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Framework integrity + install smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Shellcheck install scripts
        run: shellcheck -x setup.sh update.sh lib/harness-update.sh scripts/validate.sh scripts/smoke-install.sh tests/test_harness_projection.sh

      - name: Validate framework integrity
        run: sh scripts/validate.sh

      - name: Install smoke test
        run: sh scripts/smoke-install.sh

      - name: Per-harness projection tests (T097)
        run: bash tests/test_harness_projection.sh

      - name: setup.sh test suite
        run: bash tests/test_setup.sh

      - name: update.sh test suite
        run: bash tests/test_update.sh

      - name: settings.json merge test suite (T111)
        run: bash tests/test_settings_merge.sh

      - name: Install backup test suite (T112)
        run: bash tests/test_install_backups.sh

      - name: Install/update smoke suite
        run: bash tests/test_install_update_smoke.sh

      - name: update.sh CLAUDE.md delivery test suite (T110)
        run: bash tests/test_update_claude_md.sh

      - name: Harness presence test suite (T098)
        run: bash tests/test_t098_harness_presence.sh

      - name: Pack choice parsing test suite
        run: bash tests/test_pack_choice_parsing.sh

      - name: harness-fetch.sh test suite
        run: bash tests/test_harness_fetch.sh

      - name: README-current test suite
        run: bash tests/test_readme_current.sh

      - name: Update removals test suite (T113)
        run: bash tests/test_update_removals.sh

      - name: One-command menu test suite (T114)
        run: bash tests/test_one_command_menu.sh

      - name: CLI and project-type menus test suite (T115)
        run: bash tests/test_cli_and_project_menus.sh

      - name: CI wires every shell suite (drift guard)
        run: python3 tests/test_ci_wires_shell_suites.py
